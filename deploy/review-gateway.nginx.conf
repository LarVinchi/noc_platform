worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
    access_log /dev/stdout;
    server_tokens off;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;
    limit_req_zone $binary_remote_addr zone=linked_intake:1m rate=2r/m;

    server {
        listen 8080;
        client_max_body_size 22m;
        auth_basic "NOC stakeholder review";
        auth_basic_user_file /etc/nginx/review.htpasswd;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        set $review_upstream http://frontend:8080;
        # A machine uses its collection-scoped API token, never browser Basic credentials.
        location = /api/document-intake/ingest {
            auth_basic off;
            limit_except POST { deny all; }
            limit_req zone=linked_intake burst=2 nodelay;
            client_max_body_size 5m;
            proxy_pass $review_upstream;
            proxy_set_header Host $host;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 60s;
        }
        location = /api/knowledge/query {
            proxy_pass $review_upstream;
            proxy_set_header Host $host;
            proxy_set_header Authorization "";
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 115s;
            proxy_redirect http://$host/ https://$host/;
        }
        location = /api/knowledge-review/query {
            proxy_pass $review_upstream;
            proxy_set_header Host $host;
            proxy_set_header Authorization "";
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 145s;
            proxy_redirect http://$host/ https://$host/;
        }
        location / {
            proxy_pass $review_upstream;
            proxy_set_header Host $host;
            # Gateway credentials are never forwarded to the preview API.
            proxy_set_header Authorization "";
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 60s;
            # The inner frontend currently reports HTTP to FastAPI.
            proxy_redirect http://$host/ https://$host/;
        }
    }

    # Container-local liveness only; never published or forwarded by Funnel.
    server {
        listen 127.0.0.1:8081;
        location = /health/live { access_log off; return 200 'ok'; }
        location / { return 404; }
    }
}
