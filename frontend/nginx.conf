worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;
    server_tokens off;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    # Docker's DNS refreshes the service address after an API container replacement.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;
    server {
        listen 8080;
        root /usr/share/nginx/html;
        client_max_body_size 22m;
        set $api_upstream http://api:8000;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        location = /health/live { access_log off; return 200 'ok'; }
        location = /api/knowledge/query {
            proxy_pass $api_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 110s;
        }
        location /api/ {
            proxy_pass $api_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }
        location /static/ {
            proxy_pass $api_upstream;
            proxy_set_header Host $host;
        }
        location /assets/ {
            try_files $uri =404;
            expires 1y;
            add_header Cache-Control "public, immutable";
            add_header X-Content-Type-Options nosniff always;
        }
        location = /redirect.html { add_header Cache-Control "no-store"; try_files $uri =404; }
        location / { add_header Cache-Control "no-cache"; try_files $uri $uri/ /index.html; }
    }
}
